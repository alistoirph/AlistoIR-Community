<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810"><title>Deploy the forwarder on Wazuh</title><desc>Admin → Wazuh Setup → Download your deployment bundle. Instructional illustration with example values, not a live screenshot.</desc><rect width="1200" height="810" fill="#f1f5f9"/><rect x="0" y="0" width="1200" height="125" rx="0" fill="#142b45"/><text x="38" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#73d9d6" font-weight="700">ALISTOIR COMMUNITY 3.0</text><text x="38" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="29" fill="white" font-weight="700">Deploy the forwarder on Wazuh</text><text x="38" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d3e1ee" font-weight="400">Admin → Wazuh Setup → Download your deployment bundle</text><rect x="1002" y="27" width="160" height="29" rx="6" fill="#29445e"/><text x="1022" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white" font-weight="700">ILLUSTRATION</text><rect x="38" y="151" width="548" height="428" rx="12" fill="white"/><circle cx="70" cy="185" r="19" fill="#007e87"/><text x="65" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">1</text><text x="103" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#142b45" font-weight="700">Generate a private bundle</text><text x="61" y="239" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">Wazuh source IP (as seen by AlistoIR)</text><rect x="61" y="251" width="502" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="73" y="277" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">WAZUH_SOURCE_IP</text><text x="61" y="329" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667d" font-weight="400">Use the source IP AlistoIR sees. Account for NAT</text><text x="61" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667d" font-weight="400">and trusted proxies.</text><rect x="61" y="412" width="259" height="40" rx="6" fill="#2160b5"/><text x="77" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="white" font-weight="600">Generate &amp; download ZIP</text><text x="61" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667d" font-weight="400">The generated ZIP contains an ingest key. Keep</text><text x="61" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667d" font-weight="400">it private.</text><rect x="614" y="151" width="548" height="428" rx="12" fill="white"/><circle cx="646" cy="185" r="19" fill="#007e87"/><text x="641" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">2</text><text x="679" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#142b45" font-weight="700">Install on the Wazuh server</text><rect x="637" y="224" width="502" height="192" rx="8" fill="#102033"/><text x="653" y="260" font-family="Consolas, monospace" font-size="16" fill="#e5edf4" font-weight="400">$ umask 077</text><text x="653" y="298" font-family="Consolas, monospace" font-size="16" fill="#e5edf4" font-weight="400">$ unzip alistoir-wazuh-deployment.zip</text><text x="653" y="336" font-family="Consolas, monospace" font-size="16" fill="#e5edf4" font-weight="400">$ cd &lt;extracted directory&gt;</text><text x="653" y="374" font-family="Consolas, monospace" font-size="16" fill="#e5edf4" font-weight="400">$ sudo bash install-alistoir-forwarder.sh</text><text x="637" y="463" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667d" font-weight="400">Use the guide for the exact copy/extract</text><text x="637" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667d" font-weight="400">commands. The bundle runs on Wazuh, not on the</text><text x="637" y="517" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667d" font-weight="400">AlistoIR VM.</text><rect x="38" y="602" width="1124" height="83" rx="8" fill="#e6f5f4"/><text x="57" y="630" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#007e87" font-weight="700">Then verify actual alert receipt</text><text x="57" y="656" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">A connectivity heartbeat confirms access. A newly saved Wazuh alert confirms that real forwarding is</text><text x="57" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">working.</text><text x="57" y="737" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667d" font-weight="400">Existing foreign forwarder? Plan a migration before replacing it or running a second service.</text><text x="38" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#52667d" font-weight="400">Illustration • Example values only • Use the copyable instructions in the guide</text></svg>