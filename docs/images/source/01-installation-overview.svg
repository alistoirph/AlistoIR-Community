<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790"><title>Installation: from Ubuntu VM to first login</title><desc>Install and download directly on the VM; Windows is optional.. Instructional illustration with example values, not a live screenshot.</desc><rect width="1200" height="790" fill="#f1f5f9"/><rect x="0" y="0" width="1200" height="125" rx="0" fill="#142b45"/><text x="38" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#73d9d6" font-weight="700">ALISTOIR COMMUNITY 3.0</text><text x="38" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="29" fill="white" font-weight="700">Installation: from Ubuntu VM to first login</text><text x="38" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d3e1ee" font-weight="400">Install and download directly on the VM; Windows is optional.</text><rect x="1002" y="27" width="160" height="29" rx="6" fill="#29445e"/><text x="1022" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white" font-weight="700">ILLUSTRATION</text><rect x="38" y="151" width="548" height="140" rx="12" fill="white"/><circle cx="70" cy="183" r="19" fill="#007e87"/><text x="65" y="189" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">1</text><text x="101" y="189" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142b45" font-weight="700">Prepare Ubuntu</text><text x="61" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#142b45" font-weight="400">24.04 LTS • x86-64</text><text x="61" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="400">2 vCPU / 4 GB RAM / 40 GB disk</text><rect x="614" y="151" width="548" height="140" rx="12" fill="white"/><circle cx="646" cy="183" r="19" fill="#007e87"/><text x="641" y="189" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">2</text><text x="677" y="189" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142b45" font-weight="700">Download the release</text><text x="637" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#142b45" font-weight="400">Installer ZIP + SHA256SUMS.txt</text><text x="637" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="400">Use the official v3.0.0 release assets.</text><rect x="38" y="311" width="548" height="140" rx="12" fill="white"/><circle cx="70" cy="343" r="19" fill="#007e87"/><text x="65" y="349" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">3</text><text x="101" y="349" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142b45" font-weight="700">Verify the checksum</text><text x="61" y="389" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#142b45" font-weight="400">sha256sum -c SHA256SUMS.txt</text><text x="61" y="417" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="400">Continue only when the result is OK.</text><rect x="614" y="311" width="548" height="140" rx="12" fill="white"/><circle cx="646" cy="343" r="19" fill="#007e87"/><text x="641" y="349" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">4</text><text x="677" y="349" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142b45" font-weight="700">Extract and configure</text><text x="637" y="389" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#142b45" font-weight="400">Set your URL, organization and email.</text><text x="637" y="417" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="400">Run sudo env ... bash install.sh.</text><rect x="38" y="471" width="548" height="140" rx="12" fill="white"/><circle cx="70" cy="503" r="19" fill="#007e87"/><text x="65" y="509" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">5</text><text x="101" y="509" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142b45" font-weight="700">Verify the services</text><text x="61" y="549" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#142b45" font-weight="400">Nginx • PHP-FPM • MariaDB • cron</text><text x="61" y="577" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="400">Check HTTPS and the login page.</text><rect x="614" y="471" width="548" height="140" rx="12" fill="white"/><circle cx="646" cy="503" r="19" fill="#007e87"/><text x="641" y="509" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">6</text><text x="677" y="509" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142b45" font-weight="700">Sign in and configure</text><text x="637" y="549" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#142b45" font-weight="400">Use the generated admin credentials.</text><text x="637" y="577" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="400">Save secrets privately; configure Wazuh next.</text><rect x="38" y="647" width="1124" height="83" rx="8" fill="#e6f5f4"/><text x="57" y="675" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#007e87" font-weight="700">Two separate installations</text><text x="57" y="701" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">The Community installer runs on AlistoIR. The generated forwarder deployment bundle runs on your Wazuh</text><text x="57" y="723" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">manager.</text><text x="38" y="768" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#52667d" font-weight="400">Illustration • Example values only • Use the copyable instructions in the guide</text></svg>