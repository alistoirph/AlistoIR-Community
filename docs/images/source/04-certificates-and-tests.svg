<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><title>Trust certificates, then test access</title><desc>Admin → Wazuh Setup → public CA certificate section. Instructional illustration with example values, not a live screenshot.</desc><rect width="1200" height="850" fill="#f1f5f9"/><rect x="0" y="0" width="1200" height="125" rx="0" fill="#142b45"/><text x="38" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#73d9d6" font-weight="700">ALISTOIR COMMUNITY 3.0</text><text x="38" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="29" fill="white" font-weight="700">Trust certificates, then test access</text><text x="38" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d3e1ee" font-weight="400">Admin → Wazuh Setup → public CA certificate section</text><rect x="1002" y="27" width="160" height="29" rx="6" fill="#29445e"/><text x="1022" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white" font-weight="700">ILLUSTRATION</text><rect x="38" y="151" width="690" height="560" rx="12" fill="white"/><circle cx="70" cy="185" r="19" fill="#007e87"/><text x="65" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">1</text><text x="103" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#142b45" font-weight="700">Paste public CA certificates</text><text x="61" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">Wazuh API public CA PEM</text><rect x="61" y="248" width="644" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="73" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">-----BEGIN CERTIFICATE-----</text><text x="74" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667d" font-weight="400">Paste the trusted public CA chain here.</text><text x="61" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">Indexer public CA PEM</text><rect x="61" y="377" width="644" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="73" y="403" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">-----BEGIN CERTIFICATE-----</text><text x="74" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667d" font-weight="400">Use the Indexer CA if it has a different issuer.</text><rect x="61" y="480" width="274" height="40" rx="6" fill="#2160b5"/><text x="77" y="506" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="white" font-weight="600">Save integration certificates</text><text x="61" y="559" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#142b45" font-weight="400">Only public certificates belong in these fields.</text><text x="61" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#a32937" font-weight="700">Never paste a PRIVATE KEY.</text><text x="61" y="637" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667d" font-weight="400">The wizard writes CA paths on the AlistoIR server and scopes</text><text x="61" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667d" font-weight="400">trust to this integration.</text><rect x="750" y="151" width="412" height="560" rx="12" fill="white"/><circle cx="782" cy="185" r="19" fill="#007e87"/><text x="777" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">2</text><text x="815" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#142b45" font-weight="700">Test connections</text><rect x="774" y="235" width="268" height="40" rx="6" fill="#2160b5"/><text x="790" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="white" font-weight="600">Test saved connections</text><rect x="774" y="307" width="364" height="111" rx="8" fill="#e6f5f4"/><text x="792" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#142b45" font-weight="700">Wazuh API</text><text x="792" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#007e87" font-weight="400">Expected: Connected;</text><text x="792" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#007e87" font-weight="400">authentication succeeded.</text><rect x="774" y="444" width="364" height="137" rx="8" fill="#e6f5f4"/><text x="792" y="477" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#142b45" font-weight="700">Wazuh Indexer</text><text x="792" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#007e87" font-weight="400">Expected: Connected;</text><text x="792" y="537" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#007e87" font-weight="400">authenticated read-only search</text><text x="792" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#007e87" font-weight="400">succeeded.</text><text x="774" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667d" font-weight="400">Example success states. Check your</text><text x="774" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667d" font-weight="400">actual result before continuing.</text><rect x="38" y="735" width="1124" height="83" rx="8" fill="#e6f5f4"/><text x="57" y="763" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#007e87" font-weight="700">If TLS verification fails</text><text x="57" y="789" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">Check the trusted CA, certificate expiry and IP/hostname SAN. Keep verification enabled and correct the</text><text x="57" y="811" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">certificate or URL.</text><text x="38" y="828" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#52667d" font-weight="400">Illustration • Example values only • Use the copyable instructions in the guide</text></svg>