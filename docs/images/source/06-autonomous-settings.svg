<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790"><title>Enable autonomous investigation with a clear scope</title><desc>Investigation Center → Autonomous Investigation Settings. Instructional illustration with example values, not a live screenshot.</desc><rect width="1200" height="790" fill="#f1f5f9"/><rect x="0" y="0" width="1200" height="125" rx="0" fill="#142b45"/><text x="38" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#73d9d6" font-weight="700">ALISTOIR COMMUNITY 3.0</text><text x="38" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="29" fill="white" font-weight="700">Enable autonomous investigation with a clear scope</text><text x="38" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d3e1ee" font-weight="400">Investigation Center → Autonomous Investigation Settings</text><rect x="1002" y="27" width="160" height="29" rx="6" fill="#29445e"/><text x="1022" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white" font-weight="700">ILLUSTRATION</text><rect x="38" y="151" width="724" height="475" rx="12" fill="white"/><text x="61" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#142b45" font-weight="700">Autonomous Investigation Settings</text><rect x="61" y="224" width="53" height="29" rx="15" fill="#007e87"/><circle cx="99" cy="238" r="10" fill="white"/><text x="130" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#142b45" font-weight="600">Enable AI autonomous investigation</text><text x="61" y="303" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">Rule IDs</text><rect x="61" y="315" width="678" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="73" y="341" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">100001,100002</text><text x="61" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667d" font-weight="400">Example: enter only the specific rule IDs you want to</text><text x="61" y="427" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667d" font-weight="400">investigate. Replace these example IDs with your own.</text><rect x="61" y="495" width="161" height="40" rx="6" fill="#2160b5"/><text x="77" y="521" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="white" font-weight="600">Save settings</text><text x="61" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667d" font-weight="400">Illustration shows enabled; enable after integrations are ready.</text><rect x="784" y="151" width="378" height="475" rx="12" fill="white"/><circle cx="817" cy="191" r="19" fill="#007e87"/><text x="812" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">1</text><text x="850" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142b45" font-weight="700">Selected rules</text><text x="807" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#142b45" font-weight="400">Comma- or space-separated</text><text x="807" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#142b45" font-weight="400">numeric IDs scope incoming</text><text x="807" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#142b45" font-weight="400">alerts.</text><circle cx="817" cy="355" r="19" fill="#007e87"/><text x="812" y="361" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">2</text><text x="850" y="361" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142b45" font-weight="700">All eligible alerts</text><text x="807" y="411" font-family="Segoe UI, Arial, sans-serif" font-size="44" fill="#007e87" font-weight="700">0</text><text x="807" y="451" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#142b45" font-weight="400">Use 0 by itself. Do not</text><text x="807" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#142b45" font-weight="400">combine 0 with other IDs.</text><rect x="38" y="650" width="1124" height="83" rx="8" fill="#e6f5f4"/><text x="57" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#007e87" font-weight="700">Verify the result</text><text x="57" y="704" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">Save, send one controlled lab alert, then check its queue, evidence and recommendation. The worker is</text><text x="57" y="726" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">scheduled every minute.</text><text x="38" y="768" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#52667d" font-weight="400">Illustration • Example values only • Use the copyable instructions in the guide</text></svg>