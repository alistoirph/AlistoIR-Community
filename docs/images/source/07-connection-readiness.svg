<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830"><title>Know which connection you are testing</title><desc>Successful API access and successful alert forwarding are separate checks.. Instructional illustration with example values, not a live screenshot.</desc><rect width="1200" height="830" fill="#f1f5f9"/><rect x="0" y="0" width="1200" height="125" rx="0" fill="#142b45"/><text x="38" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#73d9d6" font-weight="700">ALISTOIR COMMUNITY 3.0</text><text x="38" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="29" fill="white" font-weight="700">Know which connection you are testing</text><text x="38" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d3e1ee" font-weight="400">Successful API access and successful alert forwarding are separate checks.</text><rect x="1002" y="27" width="160" height="29" rx="6" fill="#29445e"/><text x="1022" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white" font-weight="700">ILLUSTRATION</text><rect x="405" y="168" width="390" height="90" rx="12" fill="white"/><text x="435" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#142b45" font-weight="700">ALISTOIR COMMUNITY</text><text x="435" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667d" font-weight="400">UI • investigations • case evidence</text><rect x="38" y="285" width="1124" height="96" rx="12" fill="white"/><circle cx="70" cy="317" r="19" fill="#007e87"/><text x="65" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">1</text><text x="104" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142b45" font-weight="700">Incoming alerts</text><text x="390" y="319" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#007e87" font-weight="600">Wazuh forwarder → AlistoIR</text><text x="390" y="349" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667d" font-weight="400">HTTPS 443 • ingest key • source IP</text><text x="104" y="369" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#52667d" font-weight="400">Verify a newly saved alert.</text><rect x="38" y="395" width="1124" height="96" rx="12" fill="white"/><circle cx="70" cy="427" r="19" fill="#007e87"/><text x="65" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">2</text><text x="104" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142b45" font-weight="700">Manager API access</text><text x="390" y="429" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#007e87" font-weight="600">AlistoIR → Wazuh Manager</text><text x="390" y="459" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667d" font-weight="400">HTTPS 55000 • API account • trusted CA</text><text x="104" y="479" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#52667d" font-weight="400">Verify authentication and collector permissions.</text><rect x="38" y="505" width="1124" height="96" rx="12" fill="white"/><circle cx="70" cy="537" r="19" fill="#007e87"/><text x="65" y="543" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">3</text><text x="104" y="542" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142b45" font-weight="700">Historical evidence</text><text x="390" y="539" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#007e87" font-weight="600">AlistoIR → Wazuh Indexer</text><text x="390" y="569" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667d" font-weight="400">HTTPS 9200 • read-only account • trusted CA</text><text x="104" y="589" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#52667d" font-weight="400">Verify search; confirm archives separately.</text><rect x="38" y="615" width="1124" height="96" rx="12" fill="white"/><circle cx="70" cy="647" r="19" fill="#007e87"/><text x="65" y="653" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="white" font-weight="700">4</text><text x="104" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#142b45" font-weight="700">AI analysis</text><text x="390" y="649" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#007e87" font-weight="600">AlistoIR → configured AI provider</text><text x="390" y="679" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667d" font-weight="400">Provider credentials • approved evidence • budget</text><text x="104" y="699" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#52667d" font-weight="400">Verify a real response, not only a saved key.</text><text x="57" y="768" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#52667d" font-weight="400">Endpoint evidence also requires the supported collector, permissions and a trusted HTTPS callback.</text><text x="38" y="808" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#52667d" font-weight="400">Illustration • Example values only • Use the copyable instructions in the guide</text></svg>