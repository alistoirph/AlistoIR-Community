<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><title>Download and verify on Ubuntu</title><desc>Terminal illustration: expected commands and output, not a recorded installation.. Instructional illustration with example values, not a live screenshot.</desc><rect width="1200" height="730" fill="#f1f5f9"/><rect x="0" y="0" width="1200" height="125" rx="0" fill="#142b45"/><text x="38" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#73d9d6" font-weight="700">ALISTOIR COMMUNITY 3.0</text><text x="38" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="29" fill="white" font-weight="700">Download and verify on Ubuntu</text><text x="38" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d3e1ee" font-weight="400">Terminal illustration: expected commands and output, not a recorded installation.</text><rect x="1002" y="27" width="160" height="29" rx="6" fill="#29445e"/><text x="1022" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white" font-weight="700">ILLUSTRATION</text><rect x="38" y="151" width="1124" height="410" rx="12" fill="#102033"/><text x="62" y="185" font-family="Consolas, monospace" font-size="17" fill="#a5c5db" font-weight="400">ubuntu@alistoir: ~/alistoir-community-download</text><text x="62" y="229" font-family="Consolas, monospace" font-size="18" fill="#e5edf4" font-weight="400">$ curl -fL -o alistoir-community-v3.0.0-one-click.zip</text><text x="62" y="263" font-family="Consolas, monospace" font-size="18" fill="#a5c5db" font-weight="400">  https://github.com/.../releases/download/v3.0.0/...zip</text><text x="62" y="297" font-family="Consolas, monospace" font-size="18" fill="#e5edf4" font-weight="400">$ curl -fL -o SHA256SUMS.txt &lt;checksum release URL&gt;</text><text x="62" y="331" font-family="Consolas, monospace" font-size="18" fill="#e5edf4" font-weight="400"></text><text x="62" y="365" font-family="Consolas, monospace" font-size="18" fill="#e5edf4" font-weight="400">$ sha256sum -c SHA256SUMS.txt</text><text x="62" y="399" font-family="Consolas, monospace" font-size="18" fill="#68d7b0" font-weight="400">alistoir-community-v3.0.0-one-click.zip: OK</text><text x="62" y="433" font-family="Consolas, monospace" font-size="18" fill="#e5edf4" font-weight="400"></text><text x="62" y="467" font-family="Consolas, monospace" font-size="18" fill="#e5edf4" font-weight="400">$ unzip alistoir-community-v3.0.0-one-click.zip</text><text x="62" y="501" font-family="Consolas, monospace" font-size="18" fill="#e5edf4" font-weight="400">$ cd alistoir-community-v3.0.0-one-click</text><rect x="38" y="585" width="1124" height="83" rx="8" fill="#e6f5f4"/><text x="57" y="613" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#007e87" font-weight="700">Use the complete URLs in step 2</text><text x="57" y="639" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">URLs are shortened in this illustration. Copy the full commands from the guide, then verify the checksum</text><text x="57" y="661" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">before extracting.</text><text x="38" y="708" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#52667d" font-weight="400">Illustration • Example values only • Use the copyable instructions in the guide</text></svg>