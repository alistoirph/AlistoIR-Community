<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><title>Wazuh Managers: connection fields</title><desc>Admin → Wazuh Managers → Add New Wazuh Manager / Edit. Instructional illustration with example values, not a live screenshot.</desc><rect width="1200" height="1000" fill="#f1f5f9"/><rect x="0" y="0" width="1200" height="125" rx="0" fill="#142b45"/><text x="38" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#73d9d6" font-weight="700">ALISTOIR COMMUNITY 3.0</text><text x="38" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="29" fill="white" font-weight="700">Wazuh Managers: connection fields</text><text x="38" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#d3e1ee" font-weight="400">Admin → Wazuh Managers → Add New Wazuh Manager / Edit</text><rect x="1002" y="27" width="160" height="29" rx="6" fill="#29445e"/><text x="1022" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white" font-weight="700">ILLUSTRATION</text><rect x="38" y="151" width="548" height="635" rx="12" fill="white"/><text x="61" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#142b45" font-weight="700">Manager API</text><rect x="614" y="151" width="548" height="635" rx="12" fill="white"/><text x="637" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#142b45" font-weight="700">Indexer / evidence search</text><text x="61" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">Routing Key</text><rect x="61" y="236" width="502" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="73" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">default</text><text x="61" y="307" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">Display Name</text><rect x="61" y="319" width="502" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="73" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">Primary Wazuh Manager</text><text x="61" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">API URL</text><rect x="61" y="402" width="502" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="73" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">https://WAZUH_HOST:55000</text><text x="61" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">API User</text><rect x="61" y="485" width="502" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="73" y="511" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">Your Wazuh API account</text><text x="61" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">API Password</text><rect x="61" y="568" width="502" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="73" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="400">[enter privately; never publish]</text><text x="61" y="656" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#007e87" font-weight="600">✓ Verify TLS certificate</text><text x="61" y="697" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">Wazuh API CA Bundle Path</text><rect x="61" y="709" width="502" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="73" y="735" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">Saved by the certificate wizard</text><text x="637" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">Indexer URL</text><rect x="637" y="236" width="502" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="649" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">https://WAZUH_HOST:9200</text><text x="637" y="307" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">Indexer User</text><rect x="637" y="319" width="502" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="649" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">Your read-only Indexer account</text><text x="637" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">Indexer Password</text><rect x="637" y="402" width="502" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="649" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="400">[enter privately; never publish]</text><text x="637" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#007e87" font-weight="600">✓ Verify Indexer TLS certificate</text><text x="637" y="531" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">Indexer CA Bundle Path</text><rect x="637" y="543" width="502" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="649" y="569" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">Saved by the certificate wizard</text><text x="637" y="614" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#52667d" font-weight="600">Indexer Timeout Seconds</text><rect x="637" y="626" width="502" height="39" rx="5" fill="#f8fafc" stroke="#d9e3ed"/><text x="649" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">15</text><text x="637" y="720" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#142b45" font-weight="400">□ Allow wazuh-archives-* searches</text><text x="637" y="751" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#52667d" font-weight="400">Enable only after archive coverage is verified.</text><rect x="38" y="807" width="176" height="40" rx="6" fill="#2160b5"/><text x="54" y="833" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="white" font-weight="600">Test Connection</text><rect x="230" y="807" width="161" height="40" rx="6" fill="#2160b5"/><text x="246" y="833" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="white" font-weight="600">Save Manager</text><text x="420" y="833" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52667d" font-weight="400">✓ Enabled   •   Community: one configured manager</text><rect x="38" y="865" width="1124" height="83" rx="8" fill="#e6f5f4"/><text x="57" y="893" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#007e87" font-weight="700">These are three different logins</text><text x="57" y="919" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">Linux SSH, Wazuh API and Indexer credentials may differ. Dashboard URL is optional and uses the web UI port,</text><text x="57" y="941" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#142b45" font-weight="400">not 55000 or 9200.</text><text x="38" y="978" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#52667d" font-weight="400">Illustration • Example values only • Use the copyable instructions in the guide</text></svg>