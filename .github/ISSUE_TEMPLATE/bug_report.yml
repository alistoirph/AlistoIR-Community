name: Bug report
description: Report a reproducible issue using sanitized test data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Never attach passwords, .env files, generated Wazuh deployment ZIPs, or raw client evidence. Report security issues privately."
  - type: input
    id: release
    attributes:
      label: Release and installer SHA-256
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Ubuntu/Wazuh versions, CPU/RAM/disk, fresh install or existing deployment. No credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error and timestamp
      description: Review/redact logs before pasting.
